# ĐT-02 · Thiết bị "IoT" giả lập (10.10.30.50) — mô phỏng camera/thiết bị dùng
# mật khẩu mặc định và dịch vụ cũ, để kiểm toán phát hiện. CHỈ dùng trong lab.
#
# Chạy trên một VM nhẹ (Alpine/Ubuntu) đặt IP 10.10.30.50, vùng IoT/OT.
#   docker compose up -d
services:
  # Giao diện web quản trị dùng tài khoản mặc định (mô phỏng camera)
  iot-web:
    image: nginx:alpine
    container_name: iot-web
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Dịch vụ Telnet (mô phỏng thiết bị cũ còn mở telnet)
  iot-telnet:
    image: alpine:3.19
    container_name: iot-telnet
    command: sh -c "apk add --no-cache busybox-extras >/dev/null && telnetd -F -l /bin/ash"
    ports:
      - "23:23"
    restart: unless-stopped
